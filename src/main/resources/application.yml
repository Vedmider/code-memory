spring:
  application:
    name: code-memory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codemem}
    username: ${DB_USERNAME:codemem}
    password: ${DB_PASSWORD:codemem}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      embeddingDimensions: ${EMBED_DIM:256}

server:
  port: 8080

app:
  codemem:
    embed-dim: ${EMBED_DIM:256}
    rrf-k: 60
    text-search-config: english   # code is English; no multilingual handling needed
    top-k: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info
