apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "code-memory.fullname" . }}-config
  labels:
    {{- include "code-memory.labels" . | nindent 4 }}
    {{- include "code-memory.selectorLabels" (dict "ctx" . "component" "app") | nindent 4 }}
data:
  DB_URL: {{ printf "jdbc:postgresql://%s:%v/%s" (include "code-memory.postgres.fullname" .) .Values.postgres.service.port .Values.postgres.auth.database | quote }}
  DB_USERNAME: {{ .Values.postgres.auth.username | quote }}
  EMBED_DIM: {{ .Values.app.config.embedDim | quote }}
  APP_CODEMEM_RRFK: {{ .Values.app.config.retrieval.rrfK | quote }}
  APP_CODEMEM_TEXTSEARCHCONFIG: {{ .Values.app.config.retrieval.textSearchConfig | quote }}
  APP_CODEMEM_TOPK: {{ .Values.app.config.retrieval.topK | quote }}
  APP_CODEMEM_PARSING_MODE: {{ include "code-memory.parsingMode" . | quote }}
  {{- $baseUrl := include "code-memory.chunking.baseUrl" . }}
  {{- if $baseUrl }}
  APP_CODEMEM_PARSING_CHUNKING_BASEURL: {{ $baseUrl | quote }}
  {{- end }}
