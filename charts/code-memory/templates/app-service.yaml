{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "code-memory.serviceAccountName" . }}
  labels:
    {{- include "code-memory.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "code-memory.fullname" . }}
  labels:
    {{- include "code-memory.labels" . | nindent 4 }}
    {{- include "code-memory.selectorLabels" (dict "ctx" . "component" "app") | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "code-memory.selectorLabels" (dict "ctx" . "component" "app") | nindent 4 }}
